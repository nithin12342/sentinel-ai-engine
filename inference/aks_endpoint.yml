# Azure ML Online Endpoint Configuration
# Biometric Recognition Inference Endpoint

$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineEndpoint.schema.json
type: online

name: biometric-recognition-endpoint
description: Real-time biometric face recognition inference endpoint

auth_mode: aad_token

sku:
  name: Standard_DS2_v2
  capacity: 2

properties:
  description: "Biometric face recognition model for identity verification"
  version: "1.0.0"

traffic:
  biometric-service: 100

deployments:
  - name: biometric-service
    endpoint_name: biometric-recognition-endpoint
    model: azureml:biometric-recognizer:5
    code_configuration:
      code: ../serving/
      scoring_script: score.py
    environment: azureml:sentinel-inference:3
    instance_type: Standard_DS2_v2
    instance_count: 2
    
    # Request/response settings
    request_settings:
      request_timeout_ms: 30000
      max_queue_wait_ms: 5000
      max_concurrent_requests_per_instance: 1
    
    # Probe settings
    liveness_probe:
      path: /health
      initial_delay: 30
      period: 10
      timeout: 5
      failure_threshold: 3
    
    readiness_probe:
      path: /health
      initial_delay: 10
      period: 10
      timeout: 5
      failure_threshold: 3
    
    resources:
      requests:
        cpu: "1.0"
        memory: "2Gi"
      limits:
        cpu: "2.0"
        memory: "4Gi"
        nvidia.com/gpu: "0"
    
    # Environment variables
    environment_variables:
      AZUREML_MODEL_DIR: "/var/azureml-app/azureml-models/biometric-recognizer/5"
      LOG_LEVEL: "INFO"
      MAX_BATCH_SIZE: "10"

# AKS inference configuration
kubernetes_config:
  namespace: sentinel-inference
  
  # Pod autoscaling
  auto_scaler:
    min_replicas: 2
    max_replicas: 10
    target_utilization: 70
  
  # Node selection for GPU
  node_selector:
    workload: "ml-inference"
  
  # Tolerations for GPU nodes
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"

# Traffic routing
traffic_rules:
  - destination: biometric-service
    weight: 100

# Auth configuration
auth_config:
  aad_token:
    allowed_tenants:
      - tenant-id-1
      - tenant-id-2
  
  keys:
    primary_key: "endpoint-primary-key"
    secondary_key: "endpoint-secondary-key"
