# Azure ML Pipeline Configuration
# Sentinel AI Engine - Training Pipeline

$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline
name: biometric_training_pipeline
display_name: Biometric Model Training Pipeline
description: Training pipeline for face recognition models

settings:
  default_compute: gpu-cluster
  default_datastore: azureml
  continue_on_step_failure: false

inputs:
  training_data:
    type: uri_folder
    path: azureml://databases/sentinel_blobs/faces/training
  
  validation_data:
    type: uri_folder
    path: azureml://databases/sentinel_blobs/faces/validation
  
  model_config:
    type: uri_file
    path: azureml://databases/sentinel_blobs/configs/model_config.yaml

outputs:
  model_output:
    type: uri_folder
    path: azureml://models/biometric-model
  
  metrics_output:
    type: uri_folder
    path: azureml://runs/biometric-metrics

jobs:
  data_preparation:
    type: command
    name: prepare_data
    compute: gpu-cluster
    code: ../training/
    command: >-
      python data_preparation.py
      --training_data ${{inputs.training_data}}
      --output_data ${{outputs.prepared_data}}
    environment: azureml:sentinel-training:5
    outputs:
      prepared_data:
        type: uri_folder
        path: azureml://databases/sentinel_blobs/processed/training
    
  model_training:
    type: command
    name: train_model
    compute: gpu-cluster
    code: ../training/
    command: >-
      python biometric_trainer.py
      --training_data ${{jobs.data_preparation.outputs.prepared_data}}
      --validation_data ${{inputs.validation_data}}
      --model_config ${{inputs.model_config}}
      --model_output ${{outputs.model_output}}
      --metrics_output ${{outputs.metrics_output}}
    environment: azureml:sentinel-training:5
    inputs:
      training_data:
        type: uri_folder
        path: ${{jobs.data_preparation.outputs.prepared_data}}
      validation_data: ${{inputs.validation_data}}
      model_config: ${{inputs.model_config}}
    outputs:
      model_output: ${{outputs.model_output}}
      metrics_output: ${{outputs.metrics_output}}
    distribution:
      type: pytorch
      process_count_per_instance: 2
    resources:
      instance_count: 2
    
  model_evaluation:
    type: command
    name: evaluate_model
    compute: cpu-cluster
    code: ../evaluation/
    command: >-
      python evaluate.py
      --model_path ${{jobs.model_training.outputs.model_output}}
      --test_data ${{inputs.validation_data}}
      --output_report ${{outputs.eval_report}}
    environment: azureml:sentinel-inference:3
    inputs:
      model_path:
        type: uri_folder
        path: ${{jobs.model_training.outputs.model_output}}
      test_data: ${{inputs.validation_data}}
    outputs:
      eval_report:
        type: uri_file
        path: azureml://runs/evaluation/report.json
    
  model_registration:
    type: command
    name: register_model
    compute: cpu-cluster
    code: ../registration/
    command: >-
      python register.py
      --model_path ${{jobs.model_training.outputs.model_output}}
      --metrics_path ${{jobs.model_training.outputs.metrics_output}}
      --model_name biometric-recognizer
      --version ${{run_id}}
    environment: azureml:sentinel-inference:3
    inputs:
      model_path:
        type: uri_folder
        path: ${{jobs.model_training.outputs.model_output}}
      metrics_path:
        type: uri_folder
        path: ${{jobs.model_training.outputs.metrics_output}}

environment:
  name: sentinel-training
  version: "5"
  python:
    conda_dependencies:
      - pip:
          - torch==2.1.0
          - torchvision==0.16.0
          - pillow==10.1.0
          - opencv-python==4.8.1
          - insightface==0.7.3
          - mxnet-cu112==1.9.1
          - onnxruntime-gpu==1.16.3
          - azureml-mlflow==1.54.0
          - mlflow==2.10.0
          - pandas==2.1.3
          - numpy==1.26.2
          - scikit-learn==1.3.2
    base_image: mcr.microsoft.com/azureml/openmpi4.1.0-cuda11.8-cudnn8-ubuntu22.04

compute:
  gpu_cluster:
    type: amlcompute
    size: Standard_NC4as_T4_v3
    min_instances: 0
    max_instances: 4
    scale_settings:
      scale_type: auto
      idle_time_before_scale_down: 300

  cpu_cluster:
    type: amlcompute
    size: Standard_DS11_v2
    min_instances: 0
    max_instances: 10
